<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BodyBlast Planner — SPS Fitness</title>
<style>
:root{
  --bg:#0a0a0f;--s1:#13131a;--s2:#1c1c26;--s3:#242433;
  --bd:#2a2a3d;--bd2:#363650;
  --tx:#f0f0ff;--tx2:#8888aa;--tx3:#55557a;
  --sps:#2255ff;--spsd:#1a2a6e;--spsb:#4477ff;
  --teal:#1D9E75;--teald:#0a2e22;
  --amb:#EF9F27;--ambd:#3a2a08;
  --red:#E24B4A;--redd:#3a1010;
  --pur:#7F77DD;--purd:#1e1a40;
  --pink:#D4537E;--pinkd:#2e1020;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;min-height:100vh}

/* ── HEADER ─────────────────────────────────────────── */
.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.logo{width:44px;height:44px;border-radius:50%;border:2px solid var(--sps);overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand h1{font-size:17px;font-weight:500;letter-spacing:.3px}
.brand p{font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--sps);background:var(--spsd);color:#aabbff;display:inline-flex;align-items:center;gap:4px}

/* ── BUTTONS ────────────────────────────────────────── */
button{font:inherit;cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12px;transition:all .12s}
.btn-p{background:var(--sps);color:#fff;border:1px solid var(--sps)}
.btn-p:hover{background:var(--spsb)}
.btn-s{background:var(--spsd);color:#aabbff;border:1px solid var(--sps)}
.btn-s:hover{background:var(--sps);color:#fff}
.btn-g{background:var(--s2);color:var(--tx2);border:1px solid var(--bd2)}
.btn-g:hover{color:var(--tx);border-color:var(--tx2)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}

/* ── MAIN ───────────────────────────────────────────── */
.main{padding:18px 20px;max-width:1300px;margin:0 auto}
.sect{font-size:10px;font-weight:600;color:var(--tx2);letter-spacing:.9px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sect::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--sps);display:block;flex-shrink:0}

/* ── CONFIG GRID ────────────────────────────────────── */
.cfg-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.ds{border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--s1)}
.ds.cardio-day{border-color:var(--amb)}
.ds-hd{padding:4px 6px;text-align:center;font-size:9px;font-weight:700;color:var(--tx2);border-bottom:1px solid var(--bd);background:var(--s2);letter-spacing:.5px;text-transform:uppercase}
.ds-hd.cardio-hd{color:var(--amb);background:#2e1e06}
.ds-body{padding:5px}
.ds-body select{width:100%;font-size:10px;padding:3px 4px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;color:var(--tx);margin-bottom:3px;outline:none}
.ds-body select:focus{border-color:var(--sps)}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:3px}
.db{padding:4px 2px;font-size:9px;font-weight:700;border:1px solid var(--bd);border-radius:4px;cursor:pointer;text-align:center;background:var(--s2);color:var(--tx2)}
.db:hover{background:var(--s3);color:var(--tx)}
.db.al{background:#0a2e1a;color:#5ddcaa;border-color:#1D9E7566}
.db.am{background:var(--spsd);color:#aabbff;border-color:#2255ff66}
.db.ai{background:var(--ambd);color:#f0b84a;border-color:#EF9F2766}
.db.ax{background:var(--redd);color:#f07070;border-color:#E24B4A66}
.rt{font-size:9px;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px;padding:2px 4px;border-radius:3px}
.rt:hover{background:var(--s3);color:var(--tx2)}
.rest-d{padding:10px 5px;text-align:center;font-size:10px;color:var(--tx3)}

/* ── BANNER ─────────────────────────────────────────── */
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:12px;border:1px solid}
.b-ok{background:var(--teald);border-color:#1D9E7555;color:#5ddcaa}
.b-err{background:var(--redd);border-color:#E24B4A55;color:#f07070}
.b-warn{background:var(--ambd);border-color:#EF9F2755;color:#f0b84a}

/* ── TEMPLATES ──────────────────────────────────────── */
.tpls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.tpl-b{font-size:11px;padding:5px 10px;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:4px}
.tpl-b:hover{background:var(--s3);color:var(--tx);border-color:var(--sps)}

/* ── ACTION BUTTONS ─────────────────────────────────── */
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}

/* ── WEEK CARDS ─────────────────────────────────────── */
.week-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:20px}
.wc{border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .1s;background:var(--s1)}
.wc:hover{border-color:var(--bd2);transform:translateY(-1px)}
.wc.sel{border-color:var(--sps)}
.wc-hd{padding:7px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.wc-body{padding:7px 8px}
.wc-ex{font-size:9px;color:var(--tx2);margin-bottom:2px;line-height:1.4}
.wc-ex b{color:var(--tx);font-weight:500}
.rcard{border:1px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;min-height:115px;color:var(--tx3);font-size:11px;gap:5px;background:var(--s1)}
.pmini{display:flex;gap:2px;flex-wrap:wrap;margin-top:5px;padding-top:5px;border-top:1px solid var(--bd)}
.pm{font-size:8px;padding:1px 5px;border-radius:3px}
.dbadge{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.dl{background:#0a2e1a;color:#5ddcaa}
.dm{background:var(--spsd);color:#aabbff}
.di{background:var(--ambd);color:#f0b84a}
.dx{background:var(--redd);color:#f07070}
.dots{display:flex;gap:2px;align-items:center}
.df{width:6px;height:6px;border-radius:50%}
.de{width:6px;height:6px;border-radius:50%;border:1px solid;opacity:.25}
/* type badges */
.tc-upper{background:var(--purd);color:#a89eff}
.tc-legs{background:var(--teald);color:#5ddcaa}
.tc-cardio{background:var(--ambd);color:#f0b84a}
.tc-mixed{background:var(--pinkd);color:#f090b0}
.badge{font-size:9px;padding:2px 8px;border-radius:12px;font-weight:500;display:inline-block}

/* ── DETAIL PANEL ───────────────────────────────────── */
.detail{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px}
.det-hd{padding:11px 14px;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px}
.det-hd h2{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--bd)}
.stn{background:var(--s1);padding:10px 12px}
.stn-hd{font-size:10px;font-weight:500;color:var(--tx2);margin-bottom:5px;display:flex;align-items:flex-start;justify-content:space-between;gap:3px}
.stn-hd-tags{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.etag{font-size:7px;color:var(--tx2);background:var(--s2);padding:1px 3px;border-radius:2px;border:1px solid var(--bd);white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.ztag{font-size:7px;padding:1px 4px;border-radius:2px;font-weight:600;white-space:nowrap}
.exrow{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.exi{font-size:12px;color:var(--tx);border:none;background:transparent;width:100%;padding:0;line-height:1.5;outline:none}
.exi:focus{background:var(--s2);border-radius:3px;padding:1px 4px}
.tbar{padding:8px 14px;background:var(--s2);border-top:1px solid var(--bd);display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--tx2)}
.pbar{display:flex;gap:3px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--bd)}
.pp{font-size:9px;padding:2px 6px;border-radius:3px;display:flex;align-items:center;gap:3px}
.pg{height:3px;background:var(--s3);border-radius:2px;width:36px}
.pgi{height:3px;border-radius:2px}
.shuf{font-size:10px;color:var(--tx2);cursor:pointer;padding:3px 9px;border:1px solid var(--bd2);border-radius:5px;background:var(--s3);display:inline-flex;align-items:center;gap:4px}
.shuf:hover{background:var(--spsd);color:#aabbff;border-color:var(--sps)}
.day-regen{font-size:10px;padding:3px 8px;background:var(--spsd);border:1px solid var(--sps);border-radius:4px;color:#aabbff;cursor:pointer;line-height:1;transition:all .12s;font-weight:500}
.day-regen:hover{background:var(--sps);color:#fff}
.stn-regen{font-size:9px;padding:1px 5px;background:var(--s3);border:1px solid var(--bd2);border-radius:3px;color:var(--tx2);cursor:pointer;line-height:1.4;transition:all .12s;flex-shrink:0}
.stn-regen:hover{background:var(--spsd);color:#aabbff;border-color:var(--sps)}

/* ── VALIDATION ─────────────────────────────────────── */
.val-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px}
.val-hd{padding:10px 14px;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.val-hd h3{font-size:13px;font-weight:500}
.vrow{padding:7px 10px 7px 14px;font-size:11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vrow:last-child{border-bottom:none}
.vc{display:flex;align-items:flex-start;gap:6px;flex:1;min-width:150px}
.vdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.fxbtn{font-size:10px;padding:3px 10px;border-radius:4px;border:none;cursor:pointer;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:3px;margin-left:auto}
.fe{background:var(--redd);color:#f07070;border:1px solid #E24B4A55}
.fw{background:var(--ambd);color:#f0b84a;border:1px solid #EF9F2755}
.fxbtn:hover{opacity:.8}
.scrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.sc{text-align:center;padding:10px;background:var(--s2);border-radius:8px;border:1px solid var(--bd)}
.scn{font-size:22px;font-weight:500}
.scl{font-size:10px;color:var(--tx2);margin-top:2px}
.wpl{padding:9px 14px;border-bottom:1px solid var(--bd)}
.wpl-lbl{font-size:10px;font-weight:600;color:var(--tx2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.vsect{padding:5px 14px;font-size:10px;font-weight:600;color:var(--tx2);letter-spacing:.6px;text-transform:uppercase;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);background:var(--s2)}

/* ── ZONE TAGS ──────────────────────────────────────── */
.z-ski{background:#3a2a08;color:#f0b84a}
.z-row{background:#3a2a08;color:#f0b84a}
.z-cable{background:var(--purd);color:#a89eff}
.z-rack{background:var(--teald);color:#5ddcaa}
.z-legmach{background:#1e1e2a;color:#8888aa}
.z-trx{background:var(--spsd);color:#aabbff}
.z-dip{background:var(--spsd);color:#aabbff}
.z-sled{background:#2e2008;color:#d4a04a}
.z-open{background:#1e1e2a;color:#8888aa}

/* ── EMPTY STATE ────────────────────────────────────── */
.empty{text-align:center;padding:3rem 1rem;color:var(--tx3);border:1px dashed var(--bd);border-radius:12px;background:var(--s1);grid-column:1/-1}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.4}

/* ── SCROLLBAR ──────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* ── MOBILE ─────────────────────────────────────────── */
@media(max-width:768px){
  .main{padding:12px 14px}
  /* Header */
  .hdr{padding:10px 14px;gap:9px}
  .logo{width:36px;height:36px}
  .brand h1{font-size:14px}
  .brand p{font-size:9px}
  .hdr-right{display:none}
  /* Config grid - 3 cols on mobile */
  .cfg-grid{grid-template-columns:repeat(3,1fr);gap:5px}
  /* Templates wrap */
  .tpls{gap:4px}
  .tpl-b{font-size:10px;padding:4px 8px}
  /* Action buttons - 2 per row */
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .btn-p,.btn-s{justify-content:center;font-size:11px;padding:9px 8px}
  /* Week grid - 2 cols on mobile, 3 on tablet */
  .week-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  /* Station grid - single column */
  .sgrid{grid-template-columns:1fr}
  /* Detail header stacks */
  .det-hd{flex-direction:column;align-items:flex-start;gap:8px}
  .det-hd h2{font-size:12px}
  /* Validation score grid - 2x2 */
  .scrow{grid-template-columns:1fr 1fr;gap:6px}
  /* Week plan difficulty pills wrap */
  .wpl>div{gap:4px}
  /* Pattern bar wraps */
  .pbar{gap:3px}
  /* Tbar stacks */
  .tbar{flex-direction:column;gap:5px;align-items:flex-start}
  /* Reduce station padding */
  .stn{padding:8px 10px}
  /* Banners full width */
  .banner{font-size:10px;padding:7px 10px}
  /* Validation rows stack */
  .vrow{flex-direction:column;gap:5px;align-items:flex-start}
  .fxbtn{margin-left:0}
}
@media(max-width:480px){
  /* Very small phones - single column everything */
  .cfg-grid{grid-template-columns:repeat(2,1fr)}
  .week-grid{grid-template-columns:1fr 1fr}
  .btns{grid-template-columns:1fr}
  .btn-p,.btn-s{font-size:12px}
}

/* ── PRINT / PDF ────────────────────────────────────── */
@media print{
  @page{size:A4 landscape;margin:8mm}
  .hdr,.btns,.cfg-wrap,.val-wrap,.tpls{display:none!important}
  body{background:#0a0a0f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .week-grid{grid-template-columns:repeat(6,1fr)!important}
  .wc{break-inside:avoid}
}
</style>
</head>

const EM = {
  ski:          {zone:'ski',    noWith:['row','dip','trx','sled']},
  row_machine:  {zone:'row',    noWith:['ski','trx','dip']},
  cable_single: {zone:'cable',  noWith:[]},

  trx:          {zone:'trx',    noWith:['row','ski','legmach','dip']},
  dip_machine:  {zone:'dip',    noWith:['trx','legmach','ski','row']},
  squat_rack:   {zone:'rack',   noWith:[]},
  pull_rack:    {zone:'pullrack', noWith:['cable','row','ski','trx','dip','legmach','sled']},
  // Free weights — fully mobile, zone null
  dumbbell:     {zone:null, noWith:[]},
  barbell:      {zone:null, noWith:[]},
  kettlebell:   {zone:null, noWith:[]},
  bodyweight:   {zone:null, noWith:[]},
  bench:        {zone:null, noWith:[]},
  box:          {zone:null, noWith:['ski','row']},
  ropes:        {zone:null, noWith:[]},
  bike:         {zone:null, noWith:[]},
  sled:         {zone:'sled', noWith:['ski']}
};

function ezn(e){ return EM[e]?.zone || null; }

function canPairEquip(e1, e2){
  const m1 = EM[e1], m2 = EM[e2];
  if(!m1||!m2) return true;
  if(!m1.zone || !m2.zone) return true;  // at least one is mobile
  if(m1.zone === m2.zone) return true;   // same zone ok
  if((m1.noWith||[]).includes(m2.zone)) return false;
  if((m2.noWith||[]).includes(m1.zone)) return false;
  return true;
}

function cableOk(e, cs, cb){
  if(e==='cable_both')   return cs===0 && cb===0;
  if(e==='cable_single') return cb===0 && cs<2;
  return true;
}

function pool(type){
  if(type==='upper')  return [...EX.upper];
  if(type==='legs')   return [...EX.legs];
  // Cardio 12x1 = cardio only, 6x2 = cardio + core for pairing
  if(type==='cardio') return [...EX.cardio.filter(ex=>!ex.legsOnly),...EX.core.filter(ex=>ex.e==='bodyweight'||ex.e==='trx')];
  if(type==='mixed')  return [...EX.upper,...EX.legs,...EX.cardio.filter(ex=>!ex.legsOnly),...EX.core,...EX.core];
  return [];
}

// ── PAIRING ────────────────────────────────────────────────────
// Equipment that is FIXED to a specific gym location.
// Two exercises can only share a station if they are in the SAME fixed zone
// OR one/both are mobile (zone null = open floor, pairs with anything).
// This prevents e.g. Cable + TRX, Cable + Rack, TRX + Rack being paired
// even though they technically don't conflict — they're just far apart.
const FIXED_ZONES = new Set(['ski','row','cable','rack','legmach','trx','dip','sled','pullrack']);
function gymProximityOk(a, b){
  const za = ezn(a.e), zb = ezn(b.e);
  // Both mobile — fine anywhere
  if(!za && !zb) return true;
  // One mobile, one fixed — mobile comes to the fixed zone, always fine
  if(!za || !zb) return true;
  // Both fixed — must be the same zone (e.g. two rack exercises is handled by bay logic)
  // Different fixed zones = physically apart in the gym, bad pairing
  if(FIXED_ZONES.has(za) && FIXED_ZONES.has(zb) && za !== zb) return false;
  return true;
}

function goodPair(a, b){
  if(!canPairEquip(a.e, b.e)) return false;
  if(!gymProximityOk(a, b)) return false;
  // Same rack bay cannot share a station
  if(a.bay && b.bay && a.bay === b.bay) return false;
  if(a.p===b.p && !['core','iso'].includes(a.p)) return false;
  if(a.p==='cardio' && b.p==='cardio') return false;
  if(a.heavy && b.heavy) return false;
  if(a.p==='hinge' && b.p==='hinge') return false;
  if((a.skill&&b.energy==='high')||(b.skill&&a.energy==='high')) return false;
  if(a.e==='cable_both'&&b.e==='cable_both') return false;
  // Sled + shuttle
  if((a.e==='sled'&&b.n.toLowerCase().includes('shuttle'))||(b.e==='sled'&&a.n.toLowerCase().includes('shuttle'))) return false;
  // Shoulder isolation overload
  const sp=['Shoulder Press','Seated Shoulder Press','Front Raise','Delt Raise'];
  if(sp.includes(a.n)&&sp.includes(b.n)) return false;
  // Double row
  const rp=['Bent Over Row','Single Arm DB Row','Upright Row','Upright Row Barbell','Incline Row','TRX Row','TRX Y Raise','T-Raise'];
  if(rp.includes(a.n)&&rp.includes(b.n)) return false;
  // Double lunge
  const lu=['Walking Lunge','Reverse Lunge','Courtsey Lunge','Split Squat','Step Up'];
  if(lu.includes(a.n)&&lu.includes(b.n)) return false;
  // Same cable attachment — can't share a station
  const cableAttach=['Facepull','Tricep Pulldown','Cable Tricep Ext','Cable Bicep Curl','Lat Pulldown','Woodchops','Cable Crunch'];
  if(cableAttach.includes(a.n)&&cableAttach.includes(b.n)) return false;
  // Calf raise variants are the same movement — never pair together
  if(a.calfRaise && b.calfRaise) return false;
  // Squat + Wall Sit — space conflict (both need wall/rack area)
  const squatWallSit=['Squat','Wall Sit'];
  if(squatWallSit.includes(a.n)&&squatWallSit.includes(b.n)) return false;
  // Step Up (box/floor area) + Hamstring Curl (leg machine) — opposite ends of the gym
  if((a.n==='Step Up'&&b.n==='Hamstring Curl')||(b.n==='Step Up'&&a.n==='Hamstring Curl')) return false;
  // Jump Squat + Sumo Jump Squat — same movement pattern, never pair together
  const jumpSquats=['Jump Squat','Sumo Jump Squat','Box Jump','Box Jump Burpee'];
  if(jumpSquats.includes(a.n)&&jumpSquats.includes(b.n)) return false;
  // Box exercises — all use the same box, max 1 per session
  const boxJumps=['Box Hops','Box Jump','Box Jump Burpee','Step Up'];
  if(boxJumps.includes(a.n)&&boxJumps.includes(b.n)) return false;
  // Cone Grab + Shuttle Run — same track
  const trackEx=['Cone Grab','Shuttle Run'];
  if(trackEx.includes(a.n)&&trackEx.includes(b.n)) return false;
  // Incline Row uses the rack — can only pair with mobile/free weight exercises or dip_machine
  if(a.inclineRow && ezn(b.e)!==null && b.e!=='dip_machine') return false;
  if(b.inclineRow && ezn(a.e)!==null && a.e!=='dip_machine') return false;
  // Pistol Squat is at the TRX end — only pairs with truly mobile exercises (no fixed zones at all)
  if(a.pistolSquat && ezn(b.e)!==null) return false;
  if(b.pistolSquat && ezn(a.e)!==null) return false;
  // Dead Hang is on a fixed pull-up rack — only pairs with truly mobile exercises
  if(a.deadHang && ezn(b.e)!==null) return false;
  if(b.deadHang && ezn(a.e)!==null) return false;
  // Box Hops can't pair with any cable exercise (opposite ends of gym)
  const cableEquip=['cable_single','cable_both'];
  if(a.n==='Box Hops'&&cableEquip.includes(b.e)) return false;
  if(b.n==='Box Hops'&&cableEquip.includes(a.e)) return false;
  // Dip variations — Dips (machine) and Bench Dip are the same movement, never in same session
  if(a.dipVariant && b.dipVariant) return false;
  // Two dip_machine exercises can never share a station (same machine)
  if(a.e==='dip_machine' && b.e==='dip_machine') return false;
  // Two TRX exercises can never share a station (one set of straps)
  if(a.e==='trx' && b.e==='trx') return false;
  // Bench Dip uses a bench — box exercises (Step Up, Box Jump, Box Hops, Box Jump Burpee) use the box
  // These are different equipment so no conflict there, but flag if somehow both bench exercises clash
  return true;
}

function pairScore(a, b){
  let s=0;
  const up=['push','pull'], lo=['squat','hinge','unilateral'];
  if((up.includes(a.p)&&lo.includes(b.p))||(lo.includes(a.p)&&up.includes(b.p))) s+=4;
  const comp=[['squat','iso'],['hinge','iso'],['push','pull'],['push','core'],['pull','core'],
              ['squat','core'],['hinge','core'],['unilateral','core'],['cardio','core'],
              ['push','iso'],['pull','iso'],['hinge','unilateral'],['squat','unilateral']];
  if(comp.some(c=>c.sort().join('+')===[a.p,b.p].sort().join('+'))) s+=3;
  if(a.energy!==b.energy) s+=2;
  if((a.role==='primary'&&b.role==='secondary')||(a.role==='secondary'&&b.role==='primary')) s+=3;
  if(a.heavy&&!b.heavy&&b.energy==='low') s+=2;
  if(b.heavy&&!a.heavy&&a.energy==='low') s+=2;
  // Soft penalty for known overused combinations — still allowed but deprioritised
  const overusedPairs=[['Deadlift','Wall Sit'],['Squat','Weighted Calf Raise'],['Bench Press','Hammer Curl']];
  const names=[a.n,b.n].sort().join('+');
  if(overusedPairs.some(p=>p.sort().join('+')=== names)) s-=3;
  return s;
}

function dscore(ed, td){ const g=Math.abs(ed-td); return g===0?1:g===1?.6:g===2?.2:.05; }
function adjUsed(di){
  const u=[];
  [-1,1].forEach(o=>{ const s=sessions[di+o]; if(s) s.stations.flatMap(x=>x.exercises).forEach(e=>u.push(e.n)); });
  return u;
}

// ── INTENSITY PROFILES ─────────────────────────────────────────
// Controls the whole-session load, not just individual exercises.
// maxHigh: max number of high-energy exercises per session
// maxHeavy: max heavy compound exercises per session
// maxIso: max isolation/low-energy exercises per session (prevent easy sessions feeling too easy)
// minHigh: minimum high-energy exercises (prevent intense sessions feeling too light)
const INTENSITY_PROFILE = {
  light:    {maxHigh:2, minHigh:0, maxHeavy:0, maxIso:99},
  moderate: {maxHigh:5, minHigh:1, maxHeavy:1, maxIso:6},
  intense:  {maxHigh:8, minHigh:3, maxHeavy:2, maxIso:4},
  max:      {maxHigh:99,minHigh:5, maxHeavy:3, maxIso:2}
};

function buildStations(type, fmt, bias, day, diff, excl=[], thisWeekUsed=[], historyUsed=[], historyPairs=[]){
  const p = pool(type);
  const [ns, es] = fmt.split('x').map(Number);
  const stns=[], sEx=[];
  const pat={push:0,pull:0,squat:0,hinge:0,unilateral:0,core:0,cardio:0,iso:0};
  let cS=0, cB=0, b1=false, b2=false, rC=0;
  // Max 3 benches per session (only 3 available in the gym)
  // Bench-using exercises: anything with e='bench', plus Hip Thrust (barbell on bench), Skull Crusher (barbell on bench)
  let benchCount=0;
  const BENCH_EX=['Hip Thrust','Skull Crusher','Bench Press'];
  // Dual-machine rules: each machine has two functions but only ONE can be used per session
  // Leg machine: randomly decide which function to prefer this session (equal rotation)
  const legMachinePrefer = Math.random() > 0.5 ? 'Hamstring Curl' : 'Leg Extension';
  let legMachUsed=false;
  // Dip/PU machine: Dips OR Assisted Pull Up — not both
  let dipMachUsed=false;
  // TRX: only one station per session (one set of straps)
  let trxUsed=false;
  // Single-cable same-attachment: once one is used, block all others with same attachment
  // These all use the same overhead/low pulley attachment — max 1 per session
  const CABLE_ATTACH=['Facepull','Tricep Pulldown','Cable Tricep Ext','Cable Bicep Curl','Lat Pulldown','Woodchops','Cable Crunch'];
  let cableAttachUsed=false;
  // Cable station count: if 2 cable stations used, dip/PU machine blocked (space restriction)
  let cableStationCount=0;
  // Dip variations: Dips (machine) OR Bench Dip — not both in same session
  let dipVariantUsed=false;
  // Shoulder Press variants: Shoulder Press OR Seated Shoulder Press — not both in same session
  let shoulderPressUsed=false;
  // Upright Row variants: DB OR Barbell — not both in same session
  let uprightRowUsed=false;
  // Box exercises: Box Hops, Box Jump, Box Jump Burpee, Step Up — all same box — max 1 per session (same box)
  let boxJumpUsed=false;
  // Track exercises: Cone Grab + Shuttle Run — max 1 per session (same track)
  let trackUsed=false;
  // Track squat pattern count — cap at 3 per legs session to avoid overloading
  let squatCount=0;
  const MAX_SQUATS = type==='legs' ? 3 : 99;
  // Calf raises: max 1 per session (both variants count as the same)
  let calfRaiseUsed=false;
  const dn = DIFF[diff]?.n||2;
  const isFri=day==='Fri', isSat=day==='Sat';
  // Intensity profile — session-level load caps
  const prof = INTENSITY_PROFILE[diff] || INTENSITY_PROFILE.moderate;
  let highEnergyCount=0, heavyCount=0, isoCount=0;

  for(let si=0; si<ns; si++){
    let chosen=[];

    if(es===2){
      const valid = p.filter(ex=>{
        if(sEx.includes(ex.n)) return false;
        if(excl.includes(ex.n)) return false; // hard block: adjacent days
        if(thisWeekUsed.includes(ex.n)) return false; // hard block: already used this week
        if(!cableOk(ex.e,cS,cB)) return false;
        if(ex.bay===1&&b1) return false;
        if(ex.bay===2&&b2) return false;
        if(ex.e==='squat_rack'&&rC>=2) return false;
        // Dual-machine: only one function per session, randomly preferred for equal rotation
        if(ex.e==='leg_machine'&&legMachUsed) return false;
        if(ex.e==='leg_machine'&&!excl.includes(legMachinePrefer)&&ex.n!==legMachinePrefer) return false;
        if(ex.e==='dip_machine'&&(dipMachUsed||cableStationCount>=2)) return false;
        if(ex.e==='trx'&&trxUsed) return false;
        if((CABLE_ATTACH.includes(ex.n)||ex.e==='cable_both')&&cableAttachUsed) return false;
        if(ex.dipVariant&&dipVariantUsed) return false;
        if(['Shoulder Press','Seated Shoulder Press'].includes(ex.n)&&shoulderPressUsed) return false;
        if(ex.uprightRow&&uprightRowUsed) return false;
        if(['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(ex.n)&&boxJumpUsed) return false;
        if(['Cone Grab','Shuttle Run'].includes(ex.n)&&trackUsed) return false;
        if((ex.e==='bench'||BENCH_EX.includes(ex.n))&&benchCount>=3) return false;
        // Calf raise: max 1 per session, and only appear occasionally
        if(ex.calfRaise&&calfRaiseUsed) return false;
        if(ex.p==='squat'&&squatCount>=MAX_SQUATS) return false;
        if(ex.calfRaise&&Math.random()>.25) return false;
        // Dead Hang: appears sparingly
        if(ex.deadHang&&Math.random()>.2) return false;
        // Intensity profile caps
        if(ex.energy==='high'&&highEnergyCount>=prof.maxHigh) return false;
        if(ex.heavy&&heavyCount>=prof.maxHeavy) return false;
        if((ex.energy==='low'&&ex.p==='iso')&&isoCount>=prof.maxIso) return false;
        if(diff==='max'&&ex.d===1&&Math.random()>.1) return false;
        if(diff==='light'&&ex.d===4&&Math.random()>.1) return false;
        const mx=Math.ceil(ns*2*.45);
        if((pat[ex.p]||0)>=mx&&ex.p!=='cardio'&&ex.p!=='iso') return false;
        if(bias==='upper'&&['squat','hinge'].includes(ex.p)&&ex.e!=='bodyweight'&&Math.random()>.3) return false;
        if(bias==='legs' &&['push','pull'].includes(ex.p)&&ex.e!=='bodyweight'&&Math.random()>.3) return false;
        return true;
      }).map(ex=>({ex, ds:dscore(ex.d,dn) - (historyUsed.includes(ex.n)?1.5:0)})).sort((a,b)=>b.ds-a.ds+Math.random()*.4-.2);

      let best=null, bestS=-1;
      const tries=Math.min(valid.length,50);
      for(let ai=0; ai<tries&&(!best||bestS<6); ai++){
        const a=valid[ai].ex;
        for(let bi=ai+1; bi<Math.min(valid.length,tries+ai); bi++){
          const b=valid[bi].ex;
          if(!goodPair(a,b)) continue;
          let cs=cS,cb=cB;
          if(a.e==='cable_single')cs++; if(a.e==='cable_both')cb++;
          if(!cableOk(b.e,cs,cb)) continue;
          const sc=pairScore(a,b)+valid[ai].ds+valid[bi].ds
            - (historyPairs.filter(p=>p===[a.n,b.n].sort().join('+')).length * 1.5);
          if(sc>bestS){bestS=sc;best=[a,b];}
        }
      }
      if(best){ chosen=best; }
      else {
        // Retry 1: keep thisWeekUsed hard block, relax other soft filters
        const relaxed = p.filter(ex=>{
          if(sEx.includes(ex.n)||excl.includes(ex.n)) return false;
          if(thisWeekUsed.includes(ex.n)) return false; // still hard block this week
          if(!cableOk(ex.e,cS,cB)) return false;
          if(ex.bay===1&&b1) return false; if(ex.bay===2&&b2) return false;
          if(ex.e==='squat_rack'&&rC>=2) return false;
          if(ex.e==='leg_machine'&&legMachUsed) return false;
          if(ex.e==='leg_machine'&&!excl.includes(legMachinePrefer)&&ex.n!==legMachinePrefer) return false;
          if(ex.e==='dip_machine'&&(dipMachUsed||cableStationCount>=2)) return false;
          if(ex.e==='trx'&&trxUsed) return false;
          if(ex.dipVariant&&dipVariantUsed) return false;
          if(['Shoulder Press','Seated Shoulder Press'].includes(ex.n)&&shoulderPressUsed) return false;
        if(ex.uprightRow&&uprightRowUsed) return false;
          if(['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(ex.n)&&boxJumpUsed) return false;
          if(['Cone Grab','Shuttle Run'].includes(ex.n)&&trackUsed) return false;
          if((ex.e==='bench'||BENCH_EX.includes(ex.n))&&benchCount>=3) return false;
          if((CABLE_ATTACH.includes(ex.n)||ex.e==='cable_both')&&cableAttachUsed) return false;
          return true;
        }).sort(()=>Math.random()-.5);
        outer: for(let ai=0;ai<Math.min(relaxed.length,20);ai++){
          for(let bi=ai+1;bi<Math.min(relaxed.length,20);bi++){
            const a=relaxed[ai],b=relaxed[bi];
            if(!goodPair(a,b)) continue;
            let cs=cS,cb=cB;
            if(a.e==='cable_single')cs++;if(a.e==='cable_both')cb++;
            if(!cableOk(b.e,cs,cb)) continue;
            chosen=[a,b]; break outer;
          }
        }
        // Retry 2: same-pattern + bay rules still enforced via goodPair
        if(!chosen.length){
          outer2: for(let ai=0;ai<Math.min(relaxed.length,30);ai++){
            for(let bi=ai+1;bi<Math.min(relaxed.length,30);bi++){
              const a=relaxed[ai],b=relaxed[bi];
              if(!goodPair(a,b)) continue;
              let cs=cS,cb=cB;
              if(a.e==='cable_single')cs++;
              if(a.e==='cable_both')cb++;
              if(!cableOk(b.e,cs,cb)) continue;
              chosen=[a,b]; break outer2;
            }
          }
        }
        // Single-exercise fallback if no valid pair found
        if(!chosen.length&&relaxed.length) chosen=[relaxed[0]];
      }
    } else if(es===1){
      const valid=p.filter(ex=>{
        if(sEx.includes(ex.n)) return false;
        if(excl.includes(ex.n)) return false;
        if(thisWeekUsed.includes(ex.n)) return false;
        if(!cableOk(ex.e,cS,cB)) return false;
        if(ex.bay===1&&b1) return false;
        if(ex.bay===2&&b2) return false;
        if(ex.e==='squat_rack'&&rC>=2) return false;
        if(ex.e==='leg_machine'&&legMachUsed) return false;
        if(ex.e==='leg_machine'&&!excl.includes(legMachinePrefer)&&ex.n!==legMachinePrefer) return false;
        if(ex.e==='dip_machine'&&(dipMachUsed||cableStationCount>=2)) return false;
        if(ex.e==='trx'&&trxUsed) return false;
        if((CABLE_ATTACH.includes(ex.n)||ex.e==='cable_both')&&cableAttachUsed) return false;
        if(ex.dipVariant&&dipVariantUsed) return false;
        if(['Shoulder Press','Seated Shoulder Press'].includes(ex.n)&&shoulderPressUsed) return false;
        if(ex.uprightRow&&uprightRowUsed) return false;
        if(['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(ex.n)&&boxJumpUsed) return false;
        if(['Cone Grab','Shuttle Run'].includes(ex.n)&&trackUsed) return false;
        if((ex.e==='bench'||BENCH_EX.includes(ex.n))&&benchCount>=3) return false;
        if(ex.calfRaise&&calfRaiseUsed) return false;
        if(ex.p==='squat'&&squatCount>=MAX_SQUATS) return false;
        if(ex.calfRaise&&Math.random()>.25) return false;
        if(ex.deadHang&&Math.random()>.2) return false;
        if(ex.sledCardio&&Math.random()>.3) return false;
        if(ex.energy==='high'&&highEnergyCount>=prof.maxHigh) return false;
        if(ex.heavy&&heavyCount>=prof.maxHeavy) return false;
        if((ex.energy==='low'&&ex.p==='iso')&&isoCount>=prof.maxIso) return false;
        if(isFri&&ex.energy==='high'&&Math.random()>.25) return false;
        const mx=Math.ceil(ns*.4);
        if((pat[ex.p]||0)>=mx&&ex.p!=='cardio') return false;
        if(diff==='max'&&ex.d===1&&Math.random()>.1) return false;
        if(diff==='light'&&ex.d===4&&Math.random()>.1) return false;
        return true;
      }).sort((a,b)=>dscore(b.d,dn)-(historyUsed.includes(b.n)?1.5:0) - dscore(a.d,dn)+(historyUsed.includes(a.n)?1.5:0)+Math.random()*.3-.15);
      chosen=valid.length?[valid[0]]:[];
    } else if(es===3){
      const valid=p.filter(ex=>{
        if(sEx.includes(ex.n)) return false;
        if(excl.includes(ex.n)) return false;
        if(thisWeekUsed.includes(ex.n)) return false;
        if(!cableOk(ex.e,cS,cB)) return false;
        if(ex.bay===1&&b1) return false;
        if(ex.bay===2&&b2) return false;
        if(ex.e==='squat_rack'&&rC>=2) return false;
        if(ex.e==='leg_machine'&&legMachUsed) return false;
        if(ex.e==='leg_machine'&&!excl.includes(legMachinePrefer)&&ex.n!==legMachinePrefer) return false;
        if(ex.e==='dip_machine'&&(dipMachUsed||cableStationCount>=2)) return false;
        if(ex.e==='trx'&&trxUsed) return false;
        if((CABLE_ATTACH.includes(ex.n)||ex.e==='cable_both')&&cableAttachUsed) return false;
        if(ex.dipVariant&&dipVariantUsed) return false;
        if(['Shoulder Press','Seated Shoulder Press'].includes(ex.n)&&shoulderPressUsed) return false;
        if(ex.uprightRow&&uprightRowUsed) return false;
        if(['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(ex.n)&&boxJumpUsed) return false;
        if(['Cone Grab','Shuttle Run'].includes(ex.n)&&trackUsed) return false;
        if((ex.e==='bench'||BENCH_EX.includes(ex.n))&&benchCount>=3) return false;
        if(ex.calfRaise&&calfRaiseUsed) return false;
        if(ex.p==='squat'&&squatCount>=MAX_SQUATS) return false;
        if(ex.calfRaise&&Math.random()>.25) return false;
        if(ex.deadHang&&Math.random()>.2) return false;
        if(ex.energy==='high'&&highEnergyCount>=prof.maxHigh) return false;
        if(ex.heavy&&heavyCount>=prof.maxHeavy) return false;
        if((ex.energy==='low'&&ex.p==='iso')&&isoCount>=prof.maxIso) return false;
        if(diff==='max'&&ex.d===1&&Math.random()>.1) return false;
        if(diff==='light'&&ex.d===4&&Math.random()>.1) return false;
        return true;
      }).sort((a,b)=>dscore(b.d,dn)-(historyUsed.includes(b.n)?1.5:0) - dscore(a.d,dn)+(historyUsed.includes(a.n)?1.5:0)+Math.random()*.3-.15);
      const primary=valid.find(e=>e.role==='primary')||valid[0];
      if(!primary){ chosen=valid.slice(0,3); }
      else {
        const rest=valid.filter(e=>e.n!==primary.n);
        const s1=rest.find(b=>goodPair(primary,b));
        if(s1){
          const s2=rest.filter(e=>e.n!==s1.n).find(c=>goodPair(primary,c)&&canPairEquip(s1.e,c.e));
          chosen=[primary,s1,s2||rest.find(e=>e.n!==s1.n)||primary].slice(0,3);
        } else { chosen=valid.slice(0,3); }
      }
    }

    if(!chosen||!chosen.length){
      const fbStrict=p.filter(ex=>!sEx.includes(ex.n)&&!thisWeekUsed.includes(ex.n));
      const fbRelaxed=p.filter(ex=>!sEx.includes(ex.n));
      const fb=fbStrict.length>=es?fbStrict:fbRelaxed;
      if(es===1){
        chosen=fb.length?[fb[0]]:[];
      } else {
        let found=null;
        outerFB: for(let ai=0;ai<Math.min(fb.length,40);ai++){
          for(let bi=ai+1;bi<Math.min(fb.length,40);bi++){
            if(goodPair(fb[ai],fb[bi])){ found=[fb[ai],fb[bi]]; break outerFB; }
          }
        }
        chosen=found||(fb.length?[fb[0]]:[]);
      }
    }
    chosen=chosen.filter(Boolean);

    const pex=chosen.find(x=>x.role==='primary')||chosen[0];
    const stZone=pex?ezn(pex.e)||'open':'open';

    chosen.forEach(ex=>{
      sEx.push(ex.n); pat[ex.p]=(pat[ex.p]||0)+1;
      if(ex.e==='cable_single') cS++;
      if(ex.e==='cable_both')   cB++;
      if(ex.e==='cable_single'||ex.e==='cable_both') cableStationCount++;
      if(ex.bay===1) b1=true;
      if(ex.bay===2) b2=true;
      if(ex.e==='squat_rack') rC++;
      // Dual-machine: once one function is used, block the other for rest of session
      if(ex.e==='leg_machine') legMachUsed=true;
      if(ex.e==='dip_machine') dipMachUsed=true;
      if(ex.e==='trx') trxUsed=true;
      if(CABLE_ATTACH.includes(ex.n)||ex.e==='cable_both') cableAttachUsed=true;
      if(ex.dipVariant) dipVariantUsed=true;
      if(['Shoulder Press','Seated Shoulder Press'].includes(ex.n)) shoulderPressUsed=true;
      if(ex.uprightRow) uprightRowUsed=true;
      if(['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(ex.n)) boxJumpUsed=true;
      if(['Cone Grab','Shuttle Run'].includes(ex.n)) trackUsed=true;
      if(ex.calfRaise) calfRaiseUsed=true;
      if(ex.p==='squat') squatCount++;
      if(ex.e==='bench'||BENCH_EX.includes(ex.n)) benchCount++;
      // Intensity profile tracking
      if(ex.energy==='high') highEnergyCount++;
      if(ex.heavy) heavyCount++;
      if(ex.energy==='low'&&ex.p==='iso') isoCount++;
    });
    stns.push({num:si+1, exercises:chosen.map(ex=>({...ex})), zone:stZone});
  }
  return {stations:stns, patterns:pat, highEnergyCount, heavyCount};
}

function getCardioFmt(cardioCount, formats){
  // For double cardio weeks always use one 12x1 and one 6x2
  if(cardioCount > 1){
    const used = formats.filter(f=>f!==null);
    if(!used.includes('12x1')) return '12x1';
    if(!used.includes('6x2'))  return '6x2';
  }
  return Math.random()>.5 ? '12x1' : '6x2';
}

function buildLayout(layout){
  const diffs = assignDifficulties(layout);
  const cardioCount = layout.filter(t=>t==='cardio').length;
  const cardioFmts = []; // track which formats have been assigned
  return layout.map((type,i)=>{
    let fmt;
    if(type==='cardio'){
      fmt = getCardioFmt(cardioCount, cardioFmts);
      cardioFmts.push(fmt);
    } else {
      fmt = TM[type].def;
    }
    return { type, fmt, diff:diffs[i], rest:false };
  });
}

function assignDifficulties(types){
  let streak=0;
  return types.map((type,i)=>{
    let diff;
    if(type==='cardio')  diff='intense';
    else if(i===4)       diff='moderate';
    else if(i===5)       diff='intense';
    else                 diff=Math.random()>.5?'intense':'moderate';
    const isHard=diff==='intense'||diff==='max';
    if(isHard&&streak>=2){ diff='moderate'; streak=0; }
    else if(isHard)      streak++;
    else                 streak=0;
    return diff;
  });
}

function smartLayout(){
  const layout=LAYOUTS[Math.floor(Math.random()*LAYOUTS.length)];
  return buildLayout(layout);
}

function smartLayoutWithHistory(){
  const history=loadHistorySync();
  if(!history.length) return smartLayout();
  const scored=LAYOUTS.map((layout,idx)=>({
    layout,idx,penalty:layoutHistoryPenalty(layout)
  })).sort((a,b)=>a.penalty-b.penalty+(Math.random()-.5)*2);
  const best=scored[0].layout;
  const result=buildLayout(best);
  // Sanity check streak
  let streak=0,ok=true;
  result.forEach(d=>{ if(d.diff==='intense'||d.diff==='max'){streak++;if(streak>=3)ok=false;}else streak=0; });
  if(!ok) return smartLayoutWithHistory();
  return result;
}

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyaqukEMfeHIiRTJyFs3RKV1q-5bC15Uo66rNvuzF1xuqwsStgCYeV0CK8jdPbHGEQXkQ/exec';
const HISTORY_KEY = 'bodyblast_history';
const HISTORY_WEEKS = 4;

// Load from Google Sheet, fall back to localStorage if offline
async function loadHistory(){
  try {
    const res = await fetch(SHEETS_URL);
    const json = await res.json();
    if(json.ok && json.weeks && json.weeks.length){
      localStorage.setItem(HISTORY_KEY, JSON.stringify(json.weeks));
      return json.weeks;
    }
  } catch(e){ console.warn('Sheet unavailable, using localStorage:', e); }
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }
  catch(e){ return []; }
}

// Sync version for use inside buildStations (uses localStorage cache)
function loadHistorySync(){
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }
  catch(e){ return []; }
}

async function saveToSheet(record){
  try {
    await fetch(SHEETS_URL, {
      method:'POST',
      mode:'no-cors',
      body: JSON.stringify(record),
      headers:{'Content-Type':'application/json'}
    });
  } catch(e){ console.warn('Sheet save failed:', e); }
  // Always cache locally too
  try {
    let h = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    h.unshift(record);
    if(h.length > HISTORY_WEEKS) h = h.slice(0, HISTORY_WEEKS);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  } catch(e){}
}

function saveHistory(history){
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch(e){}
}

function buildWeekRecord(){
  const exercises=[], pairs=[], layout=[];
  sessions.forEach(s=>{
    if(!s){ layout.push('rest'); return; }
    layout.push(s.type);
    s.stations.forEach(st=>{
      st.exercises.forEach(ex=>exercises.push(ex.n));
      if(st.exercises.length>=2){
        const key=[st.exercises[0].n,st.exercises[1].n].sort().join('+');
        pairs.push(key);
      }
    });
  });
  return {layout, exercises, pairs, date:Date.now()};
}

async function saveCurrentWeek(){
  if(sessions.every(s=>!s)){ alert('Generate a week first.'); return; }
  const record = buildWeekRecord();
  const btn = document.querySelector('[onclick="saveCurrentWeek()"]');
  if(btn){ btn.innerHTML='💾 Saving...'; btn.disabled=true; }
  await saveToSheet(record);
  if(btn){ btn.innerHTML='✅ Saved!'; setTimeout(()=>{ btn.innerHTML='💾 Save week'; btn.disabled=false; },2000); }
  renderHistory();
}

function layoutHistoryPenalty(layout){
  const history = loadHistorySync();
  let penalty = 0;
  history.forEach((week, i) => {
    if(JSON.stringify(week.layout)===JSON.stringify(layout)) penalty += (HISTORY_WEEKS-i)*5;
    const cp=layout.indexOf('cardio'), hp=week.layout.indexOf('cardio');
    if(cp!==-1&&cp===hp) penalty+=1;
  });
  return penalty;
}

async function renderHistory(){
  const el = document.getElementById('historyPanel');
  if(!el) return;
  el.innerHTML=`<div style="font-size:11px;color:var(--tx3);padding:10px 14px">⏳ Loading history from Google Sheet...</div>`;
  const history = await loadHistory();
  if(!history.length){
    el.innerHTML=`<div style="font-size:11px;color:var(--tx3);padding:10px 14px">No saved weeks yet — generate and save a week to start building history.</div>`;
    return;
  }
  el.innerHTML=history.map((w,i)=>{
    const date = new Date(w.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    const layout = w.layout.map(t=>t==='rest'?'🌙':TM[t]?`<span class="badge ${TM[t].tc}" style="font-size:8px;padding:1px 6px">${TM[t].l}</span>`:'?').join(' ');
    const label = ['Last week','2 weeks ago','3 weeks ago','4 weeks ago','5+ weeks ago'][i]||`${i+1} weeks ago`;
    return `<div style="padding:8px 14px;border-bottom:1px solid var(--bd);font-size:11px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span style="font-weight:600;color:var(--tx)">${label}</span>
        <span style="font-size:10px;color:var(--tx3)">${date}</span>
      </div>
      <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:3px">${layout}</div>
      <div style="font-size:9px;color:var(--tx3)">${w.exercises.length} exercises · ${w.pairs.length} pairs</div>
    </div>`;
  }).join('') + `<div style="padding:8px 14px"><button class="btn-g btn-sm" onclick="clearHistory()" style="font-size:10px">🗑 Clear history</button></div>`;
}

async function clearHistory(){
  if(confirm('Clear local history cache? (Sheet records remain)')){
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }
}

function clearHistory(){
  if(confirm('Clear all week history?')){ saveHistory([]); renderHistory(); }
}

function fillExercises(){
  const history = loadHistorySync();
  const historyExercises = history.flatMap(w=>w.exercises);
  const historyPairs = history.flatMap(w=>w.pairs);

  let used=[];
  sessions = cfg.map((c,i)=>{
    if(c.rest||c.type==='rest') return null;
    const type=c.type, fmt=c.fmt||TM[type].def||'6x2';
    const day=DAYS[i], diff=c.diff||TM[type].dd||'moderate';
    const adj=adjUsed(i);
    // thisWeekUsed = hard block (already placed this week)
    // historyUsed = soft penalty (used in previous weeks)
    const built=buildStations(type,fmt,TM[type].bias,day,diff,adj,used,historyExercises,historyPairs);
    used=[...used,...built.stations.flatMap(s=>s.exercises.map(e=>e.n))];
    return {type,fmt,duration:FMTT[fmt],stations:built.stations,id:'W'+(i+1),patterns:built.patterns,day,diff,highEnergyCount:built.highEnergyCount,heavyCount:built.heavyCount};
  });
  renderCards();
  document.getElementById('detailPanel').innerHTML='';
  document.getElementById('valPanel').innerHTML='';
  selDay=null;
}

// ── DOTS ───────────────────────────────────────────────────────
function dots(diff){
  const d=DIFF[diff]||DIFF.moderate;
  let h="<span class='dots'>";
  for(let i=0;i<4;i++) h+=i<d.n?`<span class="df" style="background:${d.c}"></span>`:`<span class="de" style="border-color:${d.c}"></span>`;
  return h+"</span>";
}
function dclass(d){ return {light:'dl',moderate:'dm',intense:'di',max:'dx'}[d]||'dm'; }

// ── RENDER WEEK CARDS ──────────────────────────────────────────

        ${s.stations.length>2?`<div class="wc-ex" style="color:var(--tx3)">+${s.stations.length-2} more</div>`:''}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:5px;padding-top:4px;border-top:1px solid var(--bd)">

function selectDay(i){ selDay=i; renderCards(); const s=sessions[i]; if(!s)return; renderDetail(s,i); }

// ── RENDER DAY DETAIL ──────────────────────────────────────────
function renderDetail(s, di){
  const tm=TM[s.type], dm=DIFF[s.diff]||DIFF.moderate;
  const ap=Object.entries(s.patterns).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const tot=ap.reduce((a,[k,v])=>a+v,0)||1;

  let h=`<div class="detail">
    <div class="det-hd">
      <h2>
        <span class="badge ${tm.tc}" style="padding:3px 10px;border-radius:6px">${DAYS[di]} — ${tm.l}</span>
        <span class="dbadge ${dclass(s.diff)}">${dots(s.diff)} ${dm.l}</span>
        <span style="font-size:10px;color:var(--tx2);font-weight:400">${FMTL[s.fmt]}</span>
      </h2>
      <div style="display:flex;gap:7px;align-items:center">
        <button class="shuf" onclick="reshuf(${di})">↺ Reshuffle</button>
        <span style="font-size:10px;color:var(--tx3)">${s.id}</span>
      </div>
    </div>
    <div class="sgrid">`;

  s.stations.forEach(st=>{
    const zone=st.zone||'open';
    const eq=[...new Set(st.exercises.map(x=>ELB[x.e]||x.e))].join(' · ');
    // Station difficulty = the day's difficulty setting (not calculated per-exercise)
    const sdk=s.diff;
    // Quick pairing check
    let stIssue='';
    if(st.exercises.length>=2){
      const a=st.exercises[0], b=st.exercises[1];
      if(!canPairEquip(a.e,b.e))                              stIssue='⚠ Equipment conflict';
      else if(a.p===b.p&&!['core','iso'].includes(a.p))       stIssue='⚠ Same pattern';
      else if(a.heavy&&b.heavy)                               stIssue='⚠ Two heavy lifts';
      else if(a.p==='hinge'&&b.p==='hinge')                   stIssue='△ Hinge overload';
    }
    const bc=stIssue.startsWith('⚠')?'#E24B4A':stIssue.startsWith('△')?'#EF9F27':'#2255ff';
    h+=`<div class="stn" style="border-left:2px solid ${bc}">
      <div class="stn-hd">
        <span style="color:var(--tx2);white-space:nowrap;font-weight:600">St${st.num} <span class="dbadge ${dclass(sdk)}" style="font-size:7px;padding:1px 4px">${DIFF[sdk].l}</span></span>
        <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
          <div class="stn-hd-tags">
            <span class="ztag z-${zone}">${ZL[zone]||'Floor'}</span>
            <span class="etag">${eq}</span>
          </div>
          <button class="stn-regen" onclick="reshufStation(${di},${st.num})" title="Refresh station ${st.num}">↺</button>
        </div>
      </div>`;
    st.exercises.forEach((ex,ei)=>{
      h+=`<div class="exrow"><span style="font-size:9px;color:var(--tx3);width:11px;flex-shrink:0">${ex.role==='primary'?'●':'○'}</span><input class="exi" type="text" value="${ex.n}" onchange="editEx(${di},${st.num},${ei},this.value)"/></div>`;
    });
    if(stIssue) h+=`<div style="font-size:9px;color:${bc};margin-top:3px">${stIssue}</div>`;
    h+=`</div>`;
  });

  h+=`</div>
    <div class="pbar">${ap.map(([k,v])=>{const pct=Math.round(v/tot*100);return`<span class="pp" style="background:${PBG[k]};color:${PCOL[k]}">${PL[k]} <b>${v}</b><div class="pg"><div class="pgi" style="width:${pct}%;background:${PCOL[k]}"></div></div></span>`;}).join('')}</div>
    <div class="tbar">
      <span>⏱ ${s.duration}</span>
      <span>👥 12 people · 2 per station</span>
      <span style="margin-left:auto"><span class="dbadge ${dclass(s.diff)}">${dots(s.diff)} ${dm.l}</span></span>
    </div>
  </div>`;
  document.getElementById('detailPanel').innerHTML=h;
}

function editEx(di,sn,ei,v){ const s=sessions[di]; if(!s)return; const st=s.stations.find(x=>x.num===sn); if(st)st.exercises[ei].n=v; }

function reshuf(di){
  const s=sessions[di]; if(!s)return;
  const adj=adjUsed(di);
  const oth=sessions.filter((_,i)=>i!==di&&sessions[i]).flatMap(x=>x.stations.flatMap(st=>st.exercises.map(e=>e.n)));
  const built=buildStations(s.type,s.fmt,TM[s.type].bias,DAYS[di],s.diff,adj,oth);
  sessions[di]={...s,stations:built.stations,patterns:built.patterns};
  renderCards(); renderDetail(sessions[di],di);
}

function reshufStation(di, stNum){
  const s=sessions[di];
  if(!s){ alert('reshufStation error: no session'); return; }
  const stationToReplace=s.stations.find(x=>x.num===stNum);
  if(!stationToReplace){ alert('reshufStation error: station not found'); return; }

  const adj=adjUsed(di);
  const currentStationEx=stationToReplace.exercises.map(e=>e.n);
  const otherSessionEx=s.stations.filter(x=>x.num!==stNum).flatMap(st=>st.exercises.map(e=>e.n));
  const weekUsed=sessions.filter((_,i)=>i!==di&&sessions[i]).flatMap(x=>x.stations.flatMap(st=>st.exercises.map(e=>e.n)));
  // Hard exclude: adjacent days + other stations in this session + current station exercises (so we get something new)
  const excl=[...new Set([...adj,...otherSessionEx,...currentStationEx])];

  const p=pool(s.type);
  // Use current station exercise count as target, not format (handles mixed formats)
  const es=stationToReplace.exercises.length||2;
  const dn=DIFF[s.diff]?.n||2;

  const otherEx=s.stations.filter(x=>x.num!==stNum).flatMap(st=>st.exercises);
  let cS=otherEx.filter(e=>e.e==='cable_single').length;
  let cB=otherEx.filter(e=>e.e==='cable_both').length;
  let b1=otherEx.some(e=>e.bay===1);
  let b2=otherEx.some(e=>e.bay===2);
  let rC=otherEx.filter(e=>e.e==='squat_rack').length;
  let legMachUsed=otherEx.some(e=>e.e==='leg_machine');
  let dipMachUsed=otherEx.some(e=>e.e==='dip_machine');
  let trxUsed=otherEx.some(e=>e.e==='trx');
  let cableStationCount=otherEx.filter(e=>e.e==='cable_single'||e.e==='cable_both').length;
  const CABLE_ATTACH_R=['Facepull','Tricep Pulldown','Cable Tricep Ext','Cable Bicep Curl','Lat Pulldown','Woodchops','Cable Crunch'];
  let cableAttachUsed=otherEx.some(e=>CABLE_ATTACH_R.includes(e.n));
  let dipVariantUsed=otherEx.some(e=>e.dipVariant);
  let shoulderPressUsed=otherEx.some(e=>['Shoulder Press','Seated Shoulder Press'].includes(e.n));
  let uprightRowUsed=otherEx.some(e=>e.uprightRow);
  let boxJumpUsed=otherEx.some(e=>['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(e.n));
  let trackUsed=otherEx.some(e=>['Cone Grab','Shuttle Run'].includes(e.n));
  let calfRaiseUsed=otherEx.some(e=>e.calfRaise);
  let benchCount=otherEx.filter(e=>e.e==='bench'||['Hip Thrust','Skull Crusher','Bench Press'].includes(e.n)).length;
  const BEX=['Hip Thrust','Skull Crusher','Bench Press'];
  // Equal rotation between leg machine exercises
  const legMachinePrefer = Math.random()>.5?'Hamstring Curl':'Leg Extension';

  const valid=p.filter(ex=>{
    if(excl.includes(ex.n)) return false;
    if(!cableOk(ex.e,cS,cB)) return false;
    if(ex.bay===1&&b1) return false;
    if(ex.bay===2&&b2) return false;
    if(ex.e==='squat_rack'&&rC>=2) return false;
    if(ex.e==='leg_machine'&&legMachUsed) return false;
    if(ex.e==='leg_machine'&&!legMachUsed&&ex.n!==legMachinePrefer) return false;
    if(ex.e==='dip_machine'&&(dipMachUsed||cableStationCount>=2)) return false;
    if(ex.e==='trx'&&trxUsed) return false;
    if((CABLE_ATTACH_R.includes(ex.n)||ex.e==='cable_both')&&cableAttachUsed) return false;
    if(ex.dipVariant&&dipVariantUsed) return false;
    if(['Shoulder Press','Seated Shoulder Press'].includes(ex.n)&&shoulderPressUsed) return false;
        if(ex.uprightRow&&uprightRowUsed) return false;
    if(['Box Hops','Box Jump','Box Jump Burpee','Step Up'].includes(ex.n)&&boxJumpUsed) return false;
    if(['Cone Grab','Shuttle Run'].includes(ex.n)&&trackUsed) return false;
    if((ex.e==='bench'||BEX.includes(ex.n))&&benchCount>=3) return false;
    if(ex.calfRaise&&calfRaiseUsed) return false;
        if(ex.p==='squat'&&squatCount>=MAX_SQUATS) return false;
    if(ex.calfRaise&&Math.random()>.25) return false;
    if(s.diff==='max'&&ex.d===1&&Math.random()>.1) return false;
    if(s.diff==='light'&&ex.d===4&&Math.random()>.1) return false;
    return true;
  }).map(ex=>({ex,ds:dscore(ex.d,dn)-(weekUsed.includes(ex.n)?2.5:0)})).sort((a,b)=>b.ds-a.ds+Math.random()*.4-.2);

  let newExercises=[];
  if(es===1){
    newExercises=valid.length?[valid[0].ex]:stationToReplace.exercises;
  } else {
    let best=null, bestS=-1;
    const tries=Math.min(valid.length,30);
    for(let ai=0;ai<tries&&(!best||bestS<6);ai++){
      const a=valid[ai].ex;
      for(let bi=ai+1;bi<Math.min(valid.length,tries+ai);bi++){
        const b=valid[bi].ex;
        if(!goodPair(a,b)) continue;
        let cs=cS,cb=cB;
        if(a.e==='cable_single')cs++;if(a.e==='cable_both')cb++;
        if(!cableOk(b.e,cs,cb)) continue;
        const sc=pairScore(a,b)+valid[ai].ds+valid[bi].ds;
        if(sc>bestS){bestS=sc;best=[a,b];}
      }
    }
    if(best) newExercises=best;
    else {
      // Retry: relax soft filters — just need valid equipment and no same-pattern
      const allPool=p.filter(ex=>{
        if(excl.includes(ex.n)) return false;
        if(!cableOk(ex.e,cS,cB)) return false;
        if(ex.bay===1&&b1) return false; if(ex.bay===2&&b2) return false;
        if(ex.e==='squat_rack'&&rC>=2) return false;
        if(ex.e==='leg_machine'&&legMachUsed) return false;
        if(ex.e==='dip_machine'&&(dipMachUsed||cableStationCount>=2)) return false;
        if(ex.e==='trx'&&trxUsed) return false;
        if((CABLE_ATTACH_R.includes(ex.n)||ex.e==='cable_both')&&cableAttachUsed) return false;
        return true;
      }).sort(()=>Math.random()-.5);
      outerR: for(let ai=0;ai<Math.min(allPool.length,25);ai++){
        for(let bi=ai+1;bi<Math.min(allPool.length,25);bi++){
          const a=allPool[ai],b=allPool[bi];
          if(!goodPair(a,b)) continue;
          let cs=cS,cb=cB;
          if(a.e==='cable_single')cs++;if(a.e==='cable_both')cb++;
          if(!cableOk(b.e,cs,cb)) continue;
          newExercises=[a,b]; break outerR;
        }
      }
      if(!newExercises.length&&allPool.length>=2) newExercises=allPool.slice(0,2);
      else if(!newExercises.length) newExercises=stationToReplace.exercises;
    }
  }

  if(!newExercises.length) newExercises=stationToReplace.exercises;

  const pex=newExercises.find(x=>x.role==='primary')||newExercises[0];
  stationToReplace.exercises=newExercises.map(ex=>({...ex}));
  stationToReplace.zone=pex?ezn(pex.e)||'open':'open';

  const np={push:0,pull:0,squat:0,hinge:0,unilateral:0,core:0,cardio:0,iso:0};
  s.stations.flatMap(st=>st.exercises).forEach(ex=>np[ex.p]=(np[ex.p]||0)+1);
  sessions[di]={...s,patterns:np};

  selDay=di;
  renderCards();
  renderDetail(sessions[di],di);
}

// ── VALIDATION ─────────────────────────────────────────────────
function validateWeek(){
  if(sessions.every(s=>!s)){
    document.getElementById('valPanel').innerHTML=`<div style="text-align:center;padding:2rem;color:var(--tx3);border:1px dashed var(--bd);border-radius:12px;background:var(--s1)">Generate a week first, then validate.</div>`;
    return;
  }
  const errs=[], warns=[], oks=[];
  const act=sessions.map((s,i)=>s?{...s,di:i}:null).filter(Boolean);
  const wp={push:0,pull:0,squat:0,hinge:0,unilateral:0,core:0,cardio:0,iso:0};
  act.forEach(s=>s.stations.flatMap(st=>st.exercises).forEach(ex=>wp[ex.p]=(wp[ex.p]||0)+1));
  const tot=Object.values(wp).reduce((a,b)=>a+b,0)||1;

  // Cardio rule — 1 is standard, 2 is allowed, 0 or 3+ is an error
  const cs=act.filter(s=>s.type==='cardio');
  if(!cs.length)      errs.push({r:'Cardio',d:'Week',m:'No cardio session — at least 1 required'});
  else if(cs.length>2)errs.push({r:'Cardio',d:'Week',m:`${cs.length} cardio sessions — max 2 per week`});
  else                oks.push ({r:'Cardio',d:cs.map(s=>DAYS[s.di]).join(' + '),m:`${cs.length} cardio session${cs.length>1?' (double week)':''} ✓`});

  // Rule 1 — consecutive repeats
  for(let i=0;i<sessions.length-1;i++){
    const a=sessions[i],b=sessions[i+1]; if(!a||!b)continue;
    const an=a.stations.flatMap(s=>s.exercises.map(e=>e.n)), bn=b.stations.flatMap(s=>s.exercises.map(e=>e.n));
    const sh=an.filter(n=>bn.includes(n));
    if(sh.length) errs.push({r:'Rule 1',d:`${DAYS[i]}→${DAYS[i+1]}`,m:`Repeated: ${sh.join(', ')}`,fday:i,ftype:'consecutive',fextra:sh.join('|'),fl:'Fix'});
    else          oks.push ({r:'Rule 1',d:`${DAYS[i]}→${DAYS[i+1]}`,m:'No consecutive repeats ✓'});
  }

  // Rule 2 — pattern balance
  const pp=Math.round((wp.push||0)/tot*100), pl=Math.round((wp.pull||0)/tot*100);
  if(pp>45)      warns.push({r:'Rule 2',d:'Week',m:`Push-heavy: ${pp}%`});
  else if(pl>45) warns.push({r:'Rule 2',d:'Week',m:`Pull-heavy: ${pl}%`});
  else           oks.push  ({r:'Rule 2',d:'Week',m:`Push ${pp}% / Pull ${pl}% balanced ✓`});

  // Per-session rules
  act.forEach(s=>{
    const allEx=s.stations.flatMap(st=>st.exercises);
    const names=allEx.map(e=>e.n), equips=allEx.map(e=>e.e);
    const cs_c=equips.filter(e=>e==='cable_single').length, cb_c=equips.filter(e=>e==='cable_both').length;
    // Find the offending exercise to swap out
    const cableOffender = cb_c>1
      ? allEx.filter(e=>e.e==='cable_both')[1]?.n  // second dual cable
      : cb_c===1&&cs_c>0
        ? allEx.find(e=>e.e==='cable_single')?.n    // single cable when dual exists
        : cs_c>2
          ? allEx.filter(e=>e.e==='cable_single')[2]?.n  // third single cable
          : null;
    if(cb_c>1)                errs.push({r:'Cable',d:DAYS[s.di],m:'Max 1 dual-cable exercise per session',fday:s.di,ftype:'cable',fextra:cableOffender||'',fl:'Fix'});
    else if(cb_c===1&&cs_c>0) errs.push({r:'Cable',d:DAYS[s.di],m:'Dual-cable + single-cable conflict',fday:s.di,ftype:'cable',fextra:cableOffender||'',fl:'Fix'});
    else if(cs_c>2)           errs.push({r:'Cable',d:DAYS[s.di],m:`${cs_c} cable exercises — max 2 single`,fday:s.di,ftype:'cable',fextra:cableOffender||'',fl:'Fix'});
    else                      oks.push ({r:'Cable',d:DAYS[s.di],m:`Cable OK — ${cs_c} single${cb_c?' + 1 dual':''} ✓`});

    // Cable attachment: max 1 attachment exercise per session
    const CABLE_ATTACH_V=['Facepull','Tricep Pulldown','Cable Tricep Ext','Cable Bicep Curl','Lat Pulldown','Woodchops','Cable Crunch'];
    const attachEx=names.filter(n=>CABLE_ATTACH_V.includes(n));
    if(attachEx.length>1) errs.push({r:'Cable',d:DAYS[s.di],m:`Same cable attachment: ${attachEx.join(' + ')}`,fday:s.di,ftype:'cable',fextra:attachEx[1],fl:'Fix'});

    const b1n=names.filter(n=>BAY1.includes(n)), b2n=names.filter(n=>BAY2.includes(n));
    if(b1n.length>1) errs.push({r:'Rack',d:DAYS[s.di],m:`Bay 1 conflict: ${b1n.join(' + ')}`});
    if(b2n.length>1) errs.push({r:'Rack',d:DAYS[s.di],m:`Bay 2 conflict: ${b2n.join(' + ')}`});
    if(b1n.length<=1&&b2n.length<=1&&(b1n.length||b2n.length)) oks.push({r:'Rack',d:DAYS[s.di],m:'Rack bays OK ✓'});

    // Bench limit: max 3 per session
    const benchEx=allEx.filter(e=>e.e==='bench'||['Hip Thrust','Skull Crusher','Bench Press'].includes(e.n));
    if(benchEx.length>3) errs.push({r:'Bench',d:DAYS[s.di],m:`${benchEx.length} bench exercises — max 3 (only 3 benches available)`});
    else if(benchEx.length>0) oks.push({r:'Bench',d:DAYS[s.di],m:`Bench usage OK (${benchEx.length}/3) ✓`});
    // Dual-machine and dip variant conflicts
    const legEx=names.filter(n=>['Leg Extension','Hamstring Curl'].includes(n));
    if(legEx.length>1) errs.push({r:'Machine',d:DAYS[s.di],m:`Leg machine conflict: ${legEx.join(' + ')} — same machine, pick one`,fday:s.di,ftype:'dualmachine',fextra:legEx[1],fl:'Fix'});
    const dipMachEx=names.filter(n=>['Dips','Assisted Pull Up'].includes(n));
    if(dipMachEx.length>1) errs.push({r:'Machine',d:DAYS[s.di],m:`Dip/PU machine conflict: ${dipMachEx.join(' + ')} — only one per session`,fday:s.di,ftype:'dualmachine',fextra:dipMachEx[1],fl:'Fix'});
    const dipVariantEx=names.filter(n=>['Dips','Bench Dip'].includes(n));
    if(dipVariantEx.length>1) errs.push({r:'Dips',d:DAYS[s.di],m:`Dip variant conflict: ${dipVariantEx.join(' + ')} — same movement, pick one`,fday:s.di,ftype:'dualmachine',fextra:dipVariantEx[1],fl:'Fix'});

    s.stations.forEach(st=>{
      if(st.exercises.length>=2){
        const a=st.exercises[0],b=st.exercises[1];
        if(!canPairEquip(a.e,b.e))                            errs.push ({r:'Pairing',d:`${DAYS[s.di]} St${st.num}`,m:`Equipment conflict: ${ELB[a.e]||a.e} + ${ELB[b.e]||b.e}`,fday:s.di,ftype:'pair',fextra:st.num,fl:'Fix'});
        else if(a.p===b.p&&!['core','iso'].includes(a.p))     errs.push ({r:'Pairing',d:`${DAYS[s.di]} St${st.num}`,m:`Same pattern: ${a.p}+${a.p}`,fday:s.di,ftype:'pair',fextra:st.num,fl:'Fix'});
        else if(a.heavy&&b.heavy)                             errs.push ({r:'Pairing',d:`${DAYS[s.di]} St${st.num}`,m:`Two heavy compounds`,fday:s.di,ftype:'pair',fextra:st.num,fl:'Fix'});
        else if(a.p==='hinge'&&b.p==='hinge')                 warns.push({r:'Pairing',d:`${DAYS[s.di]} St${st.num}`,m:`Hinge overload: ${a.n} + ${b.n}`,fday:s.di,ftype:'pair',fextra:st.num,fl:'Fix'});
        else                                                  oks.push  ({r:'Pairing',d:`${DAYS[s.di]} St${st.num}`,m:`${a.n} + ${b.n} ✓`});
      }
    });
  });

  // Rule 7 — difficulty streak
  // Sunday is always rest so Sat→Mon has a break — streak resets after Saturday
  const dn=sessions.map(s=>s?DIFF[s.diff]?.n||2:null);
  let mx=0,cu=0;
  dn.forEach((d,i)=>{
    if(d&&d>=3){ cu++; mx=Math.max(mx,cu); }
    else cu=0;
    // Saturday (index 5) is always followed by Sunday rest — reset streak
    if(i===5) cu=0;
  });
  if(mx>=3) warns.push({r:'Rule 7',d:'Week',m:`${mx} consecutive Intense/Max — add a lighter day`});
  else      oks.push  ({r:'Rule 7',d:'Week',m:'Difficulty spread well managed ✓'});

  // Rule 9 — same type back to back
  for(let i=0;i<sessions.length-1;i++){
    const a=sessions[i],b=sessions[i+1]; if(!a||!b)continue;
    if(a.type===b.type) errs.push({r:'Rule 9',d:`${DAYS[i]}→${DAYS[i+1]}`,m:`Same type (${TM[a.type].l}) back to back`});
    else                oks.push ({r:'Rule 9',d:`${DAYS[i]}→${DAYS[i+1]}`,m:'No back-to-back same type ✓'});
  }

  // Rule 10 — overuse: flag ANY exercise appearing more than once across the week
  const an=act.flatMap(s=>s.stations.flatMap(st=>st.exercises.map(e=>e.n)));
  const nc={};an.forEach(n=>nc[n]=(nc[n]||0)+1);
  const ov=Object.entries(nc).filter(([n,c])=>c>1);
  if(ov.length) ov.forEach(([n,c])=>{
    const days=act.filter(s=>s.stations.flatMap(st=>st.exercises).some(ex=>ex.n===n)).map(s=>DAYS[s.di]).join(' + ');
    const firstDay=act.find(s=>s.stations.flatMap(st=>st.exercises).some(ex=>ex.n===n));
    warns.push({r:'Rule 10',d:days,m:`"${n}" used ${c}× this week`,fday:firstDay?.di,ftype:'overuse',fextra:n,fl:'Swap'});
  });
  if(!ov.length) oks.push({r:'Rule 10',d:'Week',m:'No repeated exercises across the week ✓'});

  // 4×3 sparingly
  const f4=sessions.filter(s=>s&&s.fmt==='4x3').length;
  if(f4>1) warns.push({r:'Format',d:'Week',m:`${f4} sessions using 4×3 — use sparingly`});

  const sc=Math.round((oks.length/(errs.length+warns.length+oks.length||1))*100);
  const scc=sc>=80?'#1D9E75':sc>=60?'#EF9F27':'#E24B4A';

  function mkRows(items,lvl){
    if(!items.length)return'';
    const lbl=lvl==='err'?'ERRORS — must fix':lvl==='warn'?'WARNINGS — review':'PASSED';
    const dc=lvl==='err'?'#E24B4A':lvl==='warn'?'#EF9F27':'#1D9E75';
    const bc=lvl==='err'?'fe':'fw';
    let h=`<div class="vsect">${lbl}</div>`;
    items.forEach(it=>{
      const hf=it.ftype!=null&&it.fday!=null;
      h+=`<div class="vrow"><div class="vc"><span class="vdot" style="background:${dc}"></span><span style="min-width:55px;font-size:10px;color:var(--tx3)">${it.r}</span><span style="min-width:72px;font-size:10px;font-weight:600;color:var(--tx)">${it.d}</span><span style="font-size:11px;color:${lvl==='ok'?'var(--tx3)':'var(--tx2)'}">${it.m}</span></div>${hf?`<button class="fxbtn ${bc}" data-day="${it.fday}" data-fix="${it.ftype}" data-extra="${it.fextra||''}">🪄 ${it.fl}</button>`:''}</div>`;
    });
    return h;
  }

  document.getElementById('valPanel').innerHTML=`<div class="val-wrap">
    <div class="val-hd"><h3>Week validation report</h3><span style="font-size:11px;color:var(--tx3)">${errs.length} errors · ${warns.length} warnings · ${oks.length} passed</span></div>
    <div class="scrow">
      <div class="sc"><div class="scn" style="color:${scc}">${sc}%</div><div class="scl">Score</div></div>
      <div class="sc"><div class="scn" style="color:#E24B4A">${errs.length}</div><div class="scl">Errors</div></div>
      <div class="sc"><div class="scn" style="color:#EF9F27">${warns.length}</div><div class="scl">Warnings</div></div>
      <div class="sc"><div class="scn" style="color:#1D9E75">${oks.length}</div><div class="scl">Passed</div></div>
    </div>
    <div class="wpl" style="border-bottom:1px solid var(--bd)">
      <div class="wpl-lbl">Difficulty across week</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${sessions.map((s,i)=>{
          if(!s)return`<span style="font-size:10px;padding:2px 7px;background:var(--s2);border-radius:5px;color:var(--tx3)">${DAYS[i]}: Rest</span>`;
          const dm=DIFF[s.diff]||DIFF.moderate;
          const dbg={light:'#0a2e1a',moderate:'#1a2a6e',intense:'#3a2a08',max:'#3a1010'}[s.diff]||'#1c1c26';
          const dtc={light:'#5ddcaa',moderate:'#aabbff',intense:'#f0b84a',max:'#f07070'}[s.diff]||'#8888aa';
          return`<span style="font-size:10px;padding:2px 8px;border-radius:5px;background:${dbg};color:${dtc};display:flex;align-items:center;gap:4px">${DAYS[i]} ${dots(s.diff)} ${dm.l}</span>`;
        }).join('')}
      </div>
    </div>
    <div class="wpl">
      <div class="wpl-lbl">Pattern balance</div>
      <div style="display:flex;gap:3px;flex-wrap:wrap">
        ${Object.entries(wp).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
          const pct=Math.round(v/tot*100);
          return`<span class="pp" style="background:${PBG[k]};color:${PCOL[k]}">${PL[k]} <b>${v}</b> (${pct}%)<div class="pg" style="width:44px"><div class="pgi" style="width:${pct}%;background:${PCOL[k]}"></div></div></span>`;
        }).join('')}
      </div>
    </div>
    ${mkRows(errs,'err')}${mkRows(warns,'warn')}${mkRows(oks,'ok')}
  </div>`;

  document.getElementById('valPanel').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── FIX ENGINE ─────────────────────────────────────────────────
document.addEventListener('click', e=>{
  const btn=e.target.closest('.fxbtn'); if(!btn)return;
  const di=parseInt(btn.dataset.day), ft=btn.dataset.fix, fx=btn.dataset.extra||'';
  if(isNaN(di)||!ft)return;
  doFix(di,ft,fx);
  btn.innerHTML='✓ Fixed'; btn.disabled=true; btn.closest('.vrow').style.opacity='.4';
  setTimeout(validateWeek,200);
});

function doFix(di,ft,extra){
  const s=sessions[di]; if(!s)return;
  const p=pool(s.type), adj=adjUsed(di), allUsed=s.stations.flatMap(st=>st.exercises.map(e=>e.n));
  if(ft==='consecutive'){
    const conflicts=extra.split('|').filter(Boolean);
    s.stations.forEach(st=>{ st.exercises.forEach((ex,ei)=>{ if(conflicts.includes(ex.n)){ const r=p.find(x=>!adj.includes(x.n)&&!allUsed.filter(n=>n!==ex.n).includes(x.n)&&x.n!==ex.n); if(r){allUsed[allUsed.indexOf(ex.n)]=r.n;st.exercises[ei]={...r};}} }); });
  } else if(ft==='cable'){
    // Swap offending cable exercise with a non-cable exercise from the same pool
    let done=false;
    const sessionUsed=allUsed.filter(n=>n!==extra);
    s.stations.forEach(st=>{ st.exercises.forEach((ex,ei)=>{ if(!done&&ex.n===extra){
      const partner=st.exercises.find((_,pi)=>pi!==ei);
      // Find replacement that is NOT cable equipment
      const r=p.find(x=>
        x.n!==extra &&
        !adj.includes(x.n) &&
        !sessionUsed.includes(x.n) &&
        x.e!=='cable_single' &&
        x.e!=='cable_both' &&
        (!partner||goodPair(partner,x))
      ) || p.find(x=>
        x.n!==extra &&
        !adj.includes(x.n) &&
        !sessionUsed.includes(x.n) &&
        x.e!=='cable_single' &&
        x.e!=='cable_both'
      );
      if(r){st.exercises[ei]={...r};done=true;}
    }}); });
  } else if(ft==='dualmachine'){
    let done=false;
    const sessionUsed=allUsed.filter(n=>n!==extra);
    s.stations.forEach(st=>{ st.exercises.forEach((ex,ei)=>{ if(!done&&ex.n===extra){
      // Find replacement: same pool, not same machine equipment, not already used, respects goodPair with station partner
      const partner=st.exercises.find((_,pi)=>pi!==ei);
      const r=p.find(x=>
        x.n!==extra &&
        !adj.includes(x.n) &&
        !sessionUsed.includes(x.n) &&
        x.e!==ex.e &&                          // different equipment
        (!partner||goodPair(partner,x))        // pairs well with station partner
      ) || p.find(x=>
        x.n!==extra &&
        !adj.includes(x.n) &&
        !sessionUsed.includes(x.n) &&
        x.e!==ex.e                             // fallback: ignore goodPair if needed
      );
      if(r){st.exercises[ei]={...r};done=true;}
    }}); });
  } else if(ft==='pair'){
    const sn=parseInt(extra), st=s.stations.find(x=>x.num===sn);
    if(st&&st.exercises.length>=2){ const a=st.exercises[0]; const r=p.find(x=>x.n!==a.n&&!adj.includes(x.n)&&!allUsed.filter(n=>n!==st.exercises[1].n).includes(x.n)&&goodPair(a,x)); if(r)st.exercises[1]={...r}; }
  } else if(ft==='overuse'){
    // Build week-wide usage count so we can prioritise fresh exercises
    const weekNames=sessions.filter(Boolean).flatMap(s=>s.stations.flatMap(st=>st.exercises.map(e=>e.n)));
    const weekCount={};weekNames.forEach(n=>weekCount[n]=(weekCount[n]||0)+1);
    let done=false;
    s.stations.forEach(st=>{ st.exercises.forEach((ex,ei)=>{ if(!done&&ex.n===extra){
      const sessionExcl=allUsed.filter(n=>n!==extra);
      // Tier 1: not used anywhere in the week and not in adjacent days
      const fresh=p.filter(x=>x.n!==extra&&!adj.includes(x.n)&&!sessionExcl.includes(x.n)&&!(weekCount[x.n]>0));
      // Tier 2: used only once in week (the repeat we're fixing counts as 1, so find ones at 0 or 1)
      const onceUsed=p.filter(x=>x.n!==extra&&!adj.includes(x.n)&&!sessionExcl.includes(x.n)&&(weekCount[x.n]||0)<=1);
      const r=(fresh.length?fresh:onceUsed).sort(()=>Math.random()-.5)[0];
      if(r){st.exercises[ei]={...r};done=true;}
    }});});
  }
  const np={push:0,pull:0,squat:0,hinge:0,unilateral:0,core:0,cardio:0,iso:0};
  s.stations.flatMap(st=>st.exercises).forEach(ex=>np[ex.p]=(np[ex.p]||0)+1);
  sessions[di]={...s,patterns:np};
  renderCards(); if(selDay===di) renderDetail(sessions[di],di);
}

    gap:2mm 6mm;
    text-align:right;
  }
  .meta-row{display:contents}
  .meta-label{font-size:8pt;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.5px;text-align:left}
  .meta-val{font-size:9pt;font-weight:600;text-align:right}

}

function askClaude(){
  if(sessions.every(s=>!s)){ alert('Generate a week first.'); return; }
  const sum=sessions.map((s,i)=>{
    if(!s)return`${DAYS[i]}: Rest`;
    return`${DAYS[i]} (${TM[s.type].l}, ${(DIFF[s.diff]||DIFF.moderate).l}, ${s.fmt}): ${s.stations.map(st=>st.exercises.map(e=>e.n).join(' + ')).join(' | ')}`;
  }).join('\n');
  const prompt=`Here is our SPS BodyBlast week:\n\n${sum}\n\nCheck against the SPS rulebook — pairing quality, zone logic, cable rule (max 2 single or 1 dual), rack bay logic (Bay1=Bench/Deadlift, Bay2=Squat/Landmine), fatigue balance, consecutive repeats, pattern balance. Give specific improvements for each day.`;
  navigator.clipboard.writeText(prompt).then(()=>{ alert('Week copied to clipboard — paste into claude.ai'); window.open('https://claude.ai/new','_blank'); }).catch(()=>{ window.open('https://claude.ai/new','_blank'); });
}

// ── BOOT ───────────────────────────────────────────────────────
renderCfg();
renderCards();
renderHistory();
</script>
