function seed() {
  document.getElementById("log").textContent = "Saving " + HISTORY.history.length + " posts to history...";
  
  // Save to localStorage first
  try {
    localStorage.setItem("sps_post_history", JSON.stringify(HISTORY.history));
    document.getElementById("log").textContent += "\nSaved to localStorage!";
  } catch(e) {
    document.getElementById("log").textContent += "\nLocalStorage failed: " + e.message;
  }

      document.getElementById("log").textContent += "\nSaved to Netlify Blobs!";
